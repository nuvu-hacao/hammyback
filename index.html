<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HammyBack">
<meta name="description" content="HammyBack – chọn thẻ hoàn tiền nhiều nhất. Dữ liệu nằm trong Google Drive của bạn.">
<title>HammyBack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app noapp" id="app">
  <svg class="wall" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
    <defs>
      <pattern id="hbWall" x="6" y="8" width="147" height="140" patternUnits="userSpaceOnUse">
        <g transform="translate(17 5) scale(.6) rotate(18 15 20)"><path d="M15 12 C15 6 12 3 9 2 M15 12 C15 6 16 3 18 1 M15 12 C17 7 20 5 23 4" stroke="#5BA84A" stroke-width="2.4"/><path d="M15 12 C20 12 22 16 20.5 21 L16.2 36.5 C15.7 38 14.3 38 13.8 36.5 L9.5 21 C8 16 10 12 15 12 Z" fill="#F28C38" stroke="#B85E1E" stroke-width="1.4"/><path d="M11.5 19 L14.5 19 M13 25 L16 25 M14 31 L16 31" stroke="#B85E1E" stroke-width="1.2"/></g>
        <g transform="translate(91 11) scale(.8)"><circle cx="13" cy="13" r="10.5" fill="#F5D27A" stroke="#B8860B" stroke-width="1.6"/><circle cx="13" cy="13" r="6.5" stroke="#B8860B" stroke-width="1"/></g>
        <g transform="translate(51 56) scale(.7) rotate(-15 17 15)"><path d="M4 26 C2 16 8 6 18 4 C26 3 32 8 31 15 C30 22 22 27 12 27 Z" fill="#8ACB6A" stroke="#4E8F3A" stroke-width="1.4"/><path d="M7 24 C13 18 20 12 27 9 M13 19 L12.5 13 M18.5 15 L19.5 10 M16.5 21 L22.5 20" stroke="#4E8F3A" stroke-width="1.2"/></g>
        <g transform="translate(123 54) scale(.7) rotate(12 15 15)"><path d="M15 4 C22 8 27 14 26 20 C25 25 20 27 15 27 C10 27 5 25 4 20 C3 14 8 8 15 4 Z" fill="#9A5A2E" stroke="#5E3418" stroke-width="1.4"/><path d="M4.5 20.5 C10 24 20 24 25.5 20.5 C25 25 20 27 15 27 C10 27 5 25 4.5 20.5 Z" fill="#D9B38C" stroke="#5E3418" stroke-width="1"/></g>
        <g transform="translate(22 100) scale(.65) rotate(-22 10 15)"><path d="M10 2 C17 8 18 20 10 28 C2 20 3 8 10 2 Z" fill="#5B4636" stroke="#2E241B" stroke-width="1.4"/><path d="M10 6 L10 24" stroke="#EFE4D2" stroke-width="1.6"/></g>
        <g transform="translate(93 103) scale(.6)"><path d="M15 2 L17 13 L28 15 L17 17 L15 28 L13 17 L2 15 L13 13 Z" fill="#FFE27A" stroke="#D99A00" stroke-width="1.4"/></g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#hbWall)"/>
  </svg>

  <div class="mockbar" id="mockbar" hidden>Chế độ thử: dữ liệu giả, không kết nối Google</div>

  <header class="top">
    <div class="titlerow">
      <button class="logo" id="logo" type="button" aria-label="Xem lại intro HammyBack"></button>
      <h1 id="title">HammyBack</h1>
    </div>
    <div class="chips">
      <button type="button" class="chip-ky" id="kyBtn" aria-haspopup="listbox" aria-expanded="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="ky">Kỳ –</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" class="kyreset" id="kyReset" hidden>Về kỳ này</button>
      <span class="chip-today" id="today">Hôm nay –</span>
      <button class="iconbtn push" id="hideBtn" type="button" aria-label="Ẩn số tiền" aria-pressed="false"></button>
      <button class="iconbtn" id="refresh" type="button" aria-label="Đọc lại Google Sheet"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div class="kymenu" id="kyMenu" role="listbox" aria-label="Chọn kỳ" hidden></div>
  </header>

  <main id="main"></main>

  <nav class="tabs" aria-label="Màn hình">
    <button type="button" data-tab="dash"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span>Tổng quan</span></button>
    <button type="button" data-tab="chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg><span>Ghi giao dịch</span></button>
    <button type="button" data-tab="cards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg><span>Thẻ</span></button>
  </nav>

  <div class="splash" id="splash" role="dialog" aria-label="HammyBack" hidden>
    <svg class="wallbig" width="100%" height="100%" aria-hidden="true"><rect width="100%" height="100%" fill="url(#hbWall)"/></svg>
    <svg class="hb-coin coin1" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="#F5D27A" stroke="#B8860B" stroke-width="2"/><path d="M13 8v10" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="hb-coin coin2" width="20" height="20" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="#F5D27A" stroke="#B8860B" stroke-width="2"/><path d="M13 8v10" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="hb-coin coin3" width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="#F5D27A" stroke="#B8860B" stroke-width="2"/><path d="M13 8v10" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="hb-coin coin4" width="18" height="18" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="#F5D27A" stroke="#B8860B" stroke-width="2"/><path d="M13 8v10" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="hb-pop" id="splashHammy"></div>
    <div class="wm hb-rise d45">Hammy<span>Back</span></div>
    <svg class="hb-rise d60" width="150" height="12" viewBox="0 0 150 12" aria-hidden="true" fill="none"><path d="M4 7 C24 2 40 11 60 6 C80 1 96 11 116 6 C128 3 138 6 146 5" stroke="#E58A3A" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="tag hb-rise d80">Hammy chọn thẻ, đầy má hoàn tiền</div>
  </div>
</div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
